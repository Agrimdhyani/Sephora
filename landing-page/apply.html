<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reviewer Application</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #000000;
            color: #ffffff;
            font-family: 'Inter', sans-serif;
            text-align: center;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 500px;
            padding: 20px;
        }

        .brand-header {
            background-color: #ffffff;
            padding: 20px 0;
            margin-bottom: 40px;
        }

        .brand-logo {
            color: #000000;
            font-size: 2.5rem;
            font-weight: 900;
            letter-spacing: 8px;
            text-transform: uppercase;
            border-top: 15px solid #000;
            border-bottom: 15px solid #000;
            padding: 10px 0;
        }

        h1 {
            font-size: 2.2rem;
            font-weight: 900;
            margin-bottom: 15px;
        }

        .highlight-bar {
            background-color: #ffffff;
            color: #000000;
            padding: 10px;
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 30px;
        }

        .steps-container {
            margin-bottom: 40px;
        }

        .steps-title {
            font-size: 1.1rem;
            margin-bottom: 20px;
        }

        .steps-list {
            list-style: none;
            line-height: 1.8;
            font-size: 1.1rem;
        }

        .apply-btn {
            display: inline-block;
            background-color: #ffffff;
            color: #000000;
            text-decoration: none;
            font-weight: 900;
            font-size: 1.2rem;
            padding: 20px 40px;
            border-radius: 12px;
            margin-bottom: 40px;
            border: 4px solid #fbcfe8; 
            transition: transform 0.2s;
        }

        .apply-btn:active {
            transform: scale(0.95);
        }

        .footer-note {
            font-size: 0.95rem;
            color: #cccccc;
            line-height: 1.4;
            padding: 0 20px;
        }
    </style>
</head>
<body>

    <div class="container">
        <header class="brand-header">
            <div class="brand-logo">SEPHORA</div>
        </header>

        <h1>Do You Love Makeup?</h1>
        <div class="highlight-bar">Become a Reviewer</div>

        <div class="steps-container">
            <p class="steps-title">Steps to Qualify:</p>
            <ul class="steps-list">
                <li>1. Enter your basic details</li>
                <li>2. Complete some simple deals</li>
                <li>3. Earn shopping credit</li>
                <li>4. Click "APPLY NOW" to get started</li>
            </ul>
        </div>

        <!-- THIS LINK REDIRECTS DIRECTLY TO YOUR TARGET -->
        <a href="https://linkthem.net/aff_c?offer_id=319&aff_id=114287" class="apply-btn">APPLY NOW</a>

        <p class="footer-note">
            You will hear back within 24 hours after submitting your application.
        </p>
    </div>

</body>
</html>
