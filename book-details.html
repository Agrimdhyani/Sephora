<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Book Description | BookStudio</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .details-container {
            display: flex;
            gap: 50px;
            padding: 50px 10%;
            background: white;
            margin: 20px auto;
            max-width: 1000px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        .details-image img {
            width: 300px;
            border-radius: 8px;
        }
        .details-info h1 { font-size: 2.5rem; margin-top: 0; }
        .details-price { font-size: 2rem; color: #27ae60; font-weight: bold; margin: 20px 0; }
        .description-text { line-height: 1.6; color: #555; font-size: 1.1rem; }
        .back-btn { display: inline-block; margin-bottom: 20px; text-decoration: none; color: #3498db; }
    </style>
</head>
<body>
    <header>
        <nav><div class="logo">BookStudio</div></nav>
    </header>

    <div class="details-container">
        <div class="details-image">
            <img id="book-img" src="" alt="Book Cover">
        </div>
        <div class="details-info">
            <a href="index.html" class="back-btn">← Back to Marketplace</a>
            <h1 id="book-title">Loading...</h1>
            <p class="details-price" id="book-price"></p>
            <div class="description-text">
                <h3>Description</h3>
                <p id="book-desc"></p>
            </div>
            <button id="add-to-cart-btn" style="padding: 15px 30px; background: #e67e22; color: white; border: none; border-radius: 5px; cursor: pointer; margin-top: 20px;">Add to Cart</button>
        </div>
    </div>

    <script>
        // Get the data from the URL (sent from index.html)
        const params = new URLSearchParams(window.location.search);
        const title = params.get('title');
        const price = params.get('price');
        const image = params.get('image');
        
        // Custom descriptions based on title
        const descriptions = {
            "FRANKENSTEIN": "A timeless classic by Mary Shelley about Victor Frankenstein, a young scientist who creates a sapient creature in an unorthodox scientific experiment.",
            "THE BOOK OF DEMONS": "An exploring journey into the mythology and folklore surrounding ancient legends and supernatural entities.",
            "A KNIGHT OF The Seven Kingdoms": "An epic tale of chivalry, honor, and battle in the medieval ages."
        };

        // Fill the page with data
        document.getElementById('book-title').innerText = title;
        document.getElementById('book-price').innerText = price;
        document.getElementById('book-img').src = image;
        document.getElementById('book-desc').innerText = descriptions[title.toUpperCase()] || "No description available for this title.";

        // Handle Add to Cart on this page too
        document.getElementById('add-to-cart-btn').addEventListener('click', () => {
            let cart = JSON.parse(localStorage.getItem('myCart')) || [];
            cart.push({ title, price });
            localStorage.setItem('myCart', JSON.stringify(cart));
            alert(title + " added to cart!");
        });
    </script>
</body>
</html>
